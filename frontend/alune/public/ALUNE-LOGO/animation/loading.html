<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALUNE Loading</title>
<style>
  :root { --alune-bg: #F7F5F0; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; }
  body { display:grid; place-items:center; background:var(--alune-bg); }
  .loader { width:min(72vw, 420px); opacity:0; animation:alune-fade 900ms ease-out 120ms forwards; }
  .loader img { display:block; width:100%; height:auto; }
  @keyframes alune-fade { to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    .loader { opacity:1; animation:none; }
  }
</style>
</head>
<body>
  <div class="loader" role="status" aria-label="Loading ALUNE">
    <img src="../loading-screen/ALUNE-loading-logo.svg" alt="ALUNE">
  </div>
</body>
</html>
